<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA — Create Account</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <a class="brand" href="login.html">NEXORA</a>
    <div class="auth-card">
      <div class="eyebrow">NEXORA ACCESS</div>
      <h1>Create your account.</h1>
      <p class="subtitle">Join the autonomous mobility experience.</p>

      <form id="signupForm" novalidate>
        <label for="signupName">Full name</label>
        <input id="signupName" type="text" autocomplete="name" placeholder="Your name" required>

        <label for="signupEmail">Email</label>
        <input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com" required>

        <label for="signupPassword">Password</label>
        <div class="password-wrap">
          <input id="signupPassword" type="password" autocomplete="new-password" placeholder="Create a password" required>
          <button class="eye" type="button" data-toggle="signupPassword" aria-label="Show password">SHOW</button>
        </div>

        <label for="signupConfirm">Confirm password</label>
        <div class="password-wrap">
          <input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat your password" required>
          <button class="eye" type="button" data-toggle="signupConfirm" aria-label="Show password">SHOW</button>
        </div>

        <button class="primary-btn" type="submit">CREATE ACCOUNT <span>↗</span></button>
        <p id="signupMessage" class="message" role="alert"></p>
      </form>

      <div class="switch">Already have an account? <a href="login.html">Sign in</a></div>
    </div>
    <div class="fine-print">NEXORA // INTELLIGENCE IN MOTION</div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
